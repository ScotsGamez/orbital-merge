name: "🐛 Bug Report"
description: "Report unexpected behavior, broken mechanics, visual glitches, or console errors"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with **Orbital Merge**! Fill out the fields below so we can diagnose and fix it quickly.
  - type: input
    id: summary
    attributes:
      label: Bug Summary
      description: A clear and concise title describing the glitch.
      placeholder: "e.g., Gate upgrade button does not update multiplier"
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "High (Game crash, progression halted, infinite loop)"
        - "Medium (Feature broken, gameplay impaired)"
        - "Low (Minor visual glitch, typo, audio glitch)"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: What sequence of actions leads to the problem?
      placeholder: |
        1. Open game
        2. Buy 3 ships
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what actually occurred?
      placeholder: "Expected gate multiplier to increase from 2x to 4x, but it stayed at 2x..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment / Browser / Device
      placeholder: "e.g., Chrome 124 on Arch Linux, Safari on iOS"
    validations:
      required: false
